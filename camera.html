<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mobile Camera Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        video {
            width: 100%;
            max-width: 400px;
            border: 1px solid #ccc;
            margin-top: 10px;
        }
        button {
            padding: 10px 16px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<h3>Open Camera</h3>

<button id="openCamera">Open Camera</button>

<video id="camera" autoplay playsinline muted></video>

<script>
const button = document.getElementById('openCamera');
const video = document.getElementById('camera');

button.addEventListener('click', async () => {

    // HTTPS check (Chrome requirement)
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
        alert('Camera works only on HTTPS');
        return;
    }

    // API support check
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('Camera API not supported');
        return;
    }

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: true,   // keep simple for Chrome
            audio: false
        });

        video.srcObject = stream;
        await video.play();

    } catch (err) {
        console.error(err);

        if (err.name === 'NotAllowedError') {
            alert('Camera permission denied');
        } else if (err.name === 'NotFoundError') {
            alert('No camera found');
        } else if (err.name === 'NotReadableError') {
            alert('Camera is already in use');
        } else if (err.name === 'SecurityError') {
            alert('HTTPS is required');
        } else {
            alert('Unable to access camera');
        }
    }
});
</script>

</body>
</html>
